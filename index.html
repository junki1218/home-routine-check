<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bcdcff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>帰宅後のルーティンチェック</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ===== ヘッダー ===== -->
  <header id="appHeader">
    <div class="head-left">
      <div class="head-title">帰宅後のルーティン</div>
      <div class="head-date" id="headDate">—</div>
    </div>
    <div class="head-btns">
      <button id="btnMotion" class="icon-btn" aria-pressed="true" aria-label="うごきを減らす">
        <span class="icon-btn-emoji">✨</span>
        <span class="icon-btn-label">うごく</span>
      </button>
      <button id="btnSound" class="icon-btn" aria-pressed="true" aria-label="音を消す">
        <span class="icon-btn-emoji">🔊</span>
        <span class="icon-btn-label">おと</span>
      </button>
      <button id="btnParent" class="icon-btn" aria-label="保護者用の画面をひらく">
        <span class="icon-btn-emoji">👨‍👩‍👦</span>
        <span class="icon-btn-label">保護者</span>
        <span id="pendingBadge" class="badge" hidden>0</span>
        <span id="lockBadge" class="lock-badge" hidden>🔒</span>
      </button>
    </div>
  </header>

  <!-- ===== 進み具合 ===== -->
  <div id="gauge">
    <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
    <div class="gauge-text" id="gaugeText">—</div>
  </div>
  <nav id="dots" aria-label="全体の進み具合"></nav>

  <!-- ===== カード画面 ===== -->
  <main id="screenCard" class="screen">
    <div id="cardStage">
      <article id="card" class="card">
        <div class="card-head">
          <span class="card-no" id="cardNo">1</span>
          <h1 class="card-title" id="cardTitle"></h1>
        </div>
        <div class="card-art" id="cardArt"></div>
        <div class="card-status" id="cardStatus" hidden></div>
      </article>
    </div>

    <div id="blockNote" class="block-note" hidden></div>

    <div id="actions" class="actions">
      <button id="btnDone" class="btn btn-done">
        <span class="btn-ico">✓</span><span>できた！</span>
      </button>
      <button id="btnPending" class="btn btn-pending">
        <span class="btn-ico">⏳</span><span>チェック待ち</span>
      </button>
      <button id="btnSkip" class="btn btn-skip" hidden>
        <span>つぎへ</span><span class="btn-ico">→</span>
      </button>
      <button id="btnUndo" class="btn btn-undo" hidden>
        <span class="btn-ico">↩</span><span>もどす</span>
      </button>
    </div>

    <div class="nav-row">
      <button id="btnPrev" class="nav-btn">← まえ</button>
      <button id="btnNext" class="nav-btn">つぎ →</button>
    </div>
  </main>

  <!-- ===== のこり画面 ===== -->
  <section id="screenRemaining" class="screen" hidden>
    <h2 class="screen-title">のこっているもの</h2>
    <ul id="remainingList" class="remain-list"></ul>
    <p class="remain-note">「チェック待ち」は、おうちの人がOKを出すと消えます。</p>
    <button id="btnBackToCards" class="btn btn-wide">カードにもどる</button>
  </section>

  <!-- ===== 完了画面 ===== -->
  <section id="screenDone" class="screen" hidden>
    <div id="doneInner">
      <div class="done-mark">🎉</div>
      <h2 class="done-title">ぜんぶ チェックできました</h2>
      <p class="done-sub">下のボタンをおして、おしまいにしよう。</p>
      <button id="btnComplete" class="btn btn-complete">完了</button>
    </div>
    <div id="celebrate" hidden>
      <div class="done-mark big">🎊</div>
      <h2 class="done-title" id="doneTitle">ぜんぶ おわりました！</h2>
      <div id="stampRow" class="stamp-row"></div>
      <p id="doneStats" class="done-stats"></p>
      <button id="btnReview" class="btn btn-wide">きょうの記録をみる</button>
    </div>
  </section>

  <canvas id="confetti" hidden></canvas>
</div>

<!-- ===== 保護者用 モーダル ===== -->
<div id="parentModal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="保護者用の画面">
    <div class="modal-head">
      <h2>保護者用</h2>
      <button id="btnCloseParent" class="close-btn" aria-label="とじる">✕</button>
    </div>
    <div class="tabs">
      <button class="tab is-active" data-tab="pending">OK待ち</button>
      <button class="tab" data-tab="today">きょう</button>
      <button class="tab" data-tab="history">記録</button>
      <button class="tab" data-tab="settings">せってい</button>
    </div>
    <div class="modal-body">
      <div class="tab-panel" data-panel="pending"></div>
      <div class="tab-panel" data-panel="today" hidden></div>
      <div class="tab-panel" data-panel="history" hidden></div>
      <div class="tab-panel" data-panel="settings" hidden></div>
    </div>
  </div>
</div>

<!-- ===== パターン認証 ===== -->
<div id="lockOverlay" class="modal lock-modal" hidden>
  <div class="lock-box" role="dialog" aria-modal="true" aria-label="パターン認証">
    <h2 id="lockTitle">パターンを 入力してください</h2>
    <p id="lockMsg" class="lock-msg"></p>
    <div id="lockGrid" class="lock-grid">
      <svg id="lockPath" class="lock-svg" aria-hidden="true"></svg>
    </div>
    <div class="lock-actions">
      <button id="lockOk" class="btn btn-wide" disabled>けってい</button>
      <div class="lock-sub">
        <button id="lockClear" class="nav-btn">やりなおす</button>
        <button id="lockCancel" class="nav-btn">やめる</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
